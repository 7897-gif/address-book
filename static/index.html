<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Address Book · Software Engineering (FZU-MU)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 23V10h7.2c2.9 0 4.6 1.4 4.6 3.7 0 1.6-.9 2.8-2.3 3.3v.1c1.8.4 3 1.7 3 3.6 0 2.5-1.9 4.3-5 4.3H9Z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="M9 7h6M9 11h4"/></svg>
        </div>
        <div>
          <strong>Address Book</strong>
          <small>Software Engineering · FZU-MU</small>
        </div>
      </div>

      <nav class="nav" aria-label="Filters">
        <button class="nav-item is-active" data-filter="all" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          All contacts
          <span class="count" id="count-all">0</span>
        </button>
        <button class="nav-item" data-filter="favorites" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2Z"/></svg>
          Favorites
          <span class="count" id="count-favorites">0</span>
        </button>
      </nav>

      <div class="sidebar-note">
        <p style="margin:0 0 6px">Everything is stored in a local SQLite file, so your data survives a restart.</p>
        <p style="margin:0">Press <kbd>N</kbd> to add a contact, <kbd>/</kbd> to search.</p>
      </div>

      <div class="sidebar-footer" id="sidebar-stats"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search name, company, phone, email…" autocomplete="off" aria-label="Search contacts" />
        </div>

        <div class="actions">
          <a class="btn ghost" href="/api/template" download title="Download an empty import template">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 15h6M9 11h2"/></svg>
            Template
          </a>
          <button class="btn ghost" id="btn-import" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
            Import
          </button>
          <button class="btn ghost" id="btn-export" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
            Export
          </button>
          <button class="btn primary" id="btn-new" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            New contact
          </button>
        </div>
      </header>

      <section class="list-head">
        <h1 id="list-title">All contacts</h1>
        <p id="list-subtitle">Loading…</p>
      </section>

      <section id="grid" class="grid" aria-live="polite"></section>

      <div id="empty" class="empty" hidden>
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#98a2b3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        <h3 id="empty-title">No contacts yet</h3>
        <p id="empty-text">Add your first contact, or import an Excel sheet to get started.</p>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" aria-live="polite"></div>
  <input id="file-input" type="file" accept=".xlsx" hidden />

  <script src="/js/app.js"></script>
</body>
</html>
